# Render blueprint for the Prakriva Flask backend (dosha, calorie, meal
# planning and the maternal disease-detection pipeline with its XGBoost models).
#
# Deploy: push this repo, then in Render choose "New +" -> "Blueprint" and point
# it at this file. Render installs backend/requirements.txt and starts run.py.
# Set the secret env vars below in the Render dashboard (they are marked
# sync:false so they are never committed). After the service is live, point the
# frontend at it by setting VITE_API_URL to the service's URL.
services:
  - type: web
    name: prakriva-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      # Match the Python the requirements' wheels target (see requirements.txt).
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: HOST
        value: 0.0.0.0
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "false"
      # Rate-limit counters. The free plan runs a single worker
      # (WEB_CONCURRENCY=1), so in-process memory is correct and cheap.
      # Setting it explicitly is what stops flask-limiter warning on every
      # boot. Change this to a redis:// URL (e.g. a Render Key Value instance)
      # if the service is ever scaled past one worker or instance.
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      # Render injects PORT automatically; config.py reads it.
      # Secrets — set these in the Render dashboard, they are not committed.
      # Both come from your (free) Supabase project: Project Settings -> API.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Powers diet chart generation, the written analysis and the patient
      # assistant. Optional — the analysis panels hide themselves when it is
      # unset, and diet charts fall back to the FoodOScope recipe path.
      # GEMINI_API_KEY2/3 are spare keys, used when an earlier one is out of
      # quota; leave them unset in the dashboard if you only have one key.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY2
        sync: false
      - key: GEMINI_API_KEY3
        sync: false
      # OPENAI_API_KEY is optional — only the LLM meal-planning / dosha-chat
      # features use it; disease detection works without it. Add it later in the
      # Render dashboard if you want those AI features.
