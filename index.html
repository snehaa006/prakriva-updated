<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prakriva — Ayurvedic Diet Management Platform</title>
    <meta name="description" content="AI-powered Ayurvedic nutrition platform connecting doctors and patients for personalized wellness solutions" />
    <meta name="author" content="Ayurvedic Wellness Team" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!--
      Brand typography: Fraunces is the editorial serif used for display
      headings (landing hero, section titles), Inter carries body and UI text.
      Both are loaded `display=swap` so text paints immediately in the fallback
      stack declared in tailwind.config.ts.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <!--
      Apply the saved theme before the first paint. Without this, a dark-mode
      user gets a flash of the light cream background on every page load, while
      React boots and ThemeContext gets a chance to add the class.
      Keep the storage key in step with CACHE_KEY in src/context/ThemeContext.tsx
      and the PREFIX in src/lib/localCache.ts.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("prakriva:theme");
          var pref = raw ? JSON.parse(raw).value : "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* storage blocked — React applies the theme a moment later */
        }
      })();
    </script>

    <meta property="og:title" content="Prakriva — Ayurvedic Diet Management Platform" />
    <meta property="og:description" content="Transform your health with personalized Ayurvedic nutrition plans powered by AI" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ayurvedic_ai" />
    <meta name="twitter:image" content="/logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
