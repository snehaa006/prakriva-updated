<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Prakriva is a light-themed app: the `.dark` palette in src/index.css is
         dormant and nothing in the UI ever switches to it. Declaring the scheme
         explicitly stops a browser on a dark-mode device from auto-darkening the
         page for us (Chrome's auto-dark on Android does exactly that to sites
         that stay silent), and keeps native controls — scrollbars, date pickers,
         selects — painted light to match. -->
    <meta name="color-scheme" content="light" />
    <title>Prakriva — Ayurvedic Diet Management Platform</title>
    <meta name="description" content="AI-powered Ayurvedic nutrition platform connecting doctors and patients for personalized wellness solutions" />
    <meta name="author" content="Ayurvedic Wellness Team" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- The landing page's display serif, matching the Prakriva wordmark. The
         app itself stays on the system sans stack, so this is the only web
         font the project loads and only the marketing page uses it
         (`font-display` in tailwind.config.ts). `display=swap` means a slow
         or blocked font request shows the Georgia fallback immediately rather
         than holding the headline blank. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <meta property="og:title" content="Prakriva — Ayurvedic Diet Management Platform" />
    <meta property="og:description" content="Transform your health with personalized Ayurvedic nutrition plans powered by AI" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ayurvedic_ai" />
    <meta name="twitter:image" content="/logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
